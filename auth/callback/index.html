<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluxus PDV • E-mail autenticado</title>
  <style>
    :root{
      --bg-a:#07101f;
      --bg-b:#1f345b;
      --bg-c:#7f8dad;
      --glass:rgba(10,18,35,.70);
      --border:rgba(255,255,255,.16);
      --text:#f8fbff;
      --muted:#d4deee;
      --primary:#5cc6ff;
      --primary-2:#a7e9ff;
      --danger:#ffcfda;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      background:
        radial-gradient(circle at 18% 18%, rgba(255,255,255,.18), transparent 19%),
        radial-gradient(circle at 84% 20%, rgba(92,198,255,.16), transparent 20%),
        radial-gradient(circle at 78% 86%, rgba(255,255,255,.13), transparent 18%),
        linear-gradient(140deg,var(--bg-a),var(--bg-b) 55%,var(--bg-c));
      overflow-x:hidden;
    }
    .shine{
      position:fixed; inset:-20%;
      pointer-events:none;
      background:
        linear-gradient(115deg, transparent 0%, rgba(255,255,255,.08) 45%, transparent 58%);
      transform:translateX(-35%);
      animation:shine 7s ease-in-out infinite;
    }
    @keyframes shine{
      0%,35%{transform:translateX(-42%)}
      70%,100%{transform:translateX(42%)}
    }
    .card{
      position:relative;
      z-index:1;
      width:min(520px,100%);
      border-radius:30px;
      border:1px solid var(--border);
      background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.045));
      box-shadow:0 28px 70px rgba(0,0,0,.38);
      backdrop-filter:blur(18px);
      padding:22px;
      animation:enter .6s ease both;
    }
    @keyframes enter{
      from{opacity:0;transform:translateY(14px) scale(.98)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }
    .inner{
      border-radius:24px;
      background:var(--glass);
      border:1px solid rgba(255,255,255,.12);
      padding:28px 24px;
      text-align:center;
    }
    .logo{
      width:min(230px,78%);
      display:block;
      margin:0 auto 14px;
      filter:drop-shadow(0 22px 32px rgba(0,0,0,.32));
    }
    .ok{
      width:54px;height:54px;
      border-radius:18px;
      margin:0 auto 18px;
      display:grid;
      place-items:center;
      color:#04111f;
      font-weight:900;
      background:linear-gradient(135deg,var(--primary-2),var(--primary));
      box-shadow:0 14px 34px rgba(92,198,255,.28);
    }
    h1{
      margin:0 0 10px;
      font-size:clamp(1.8rem,5vw,2.4rem);
      letter-spacing:-.04em;
      line-height:1.05;
    }
    p{
      margin:0 auto 22px;
      color:var(--muted);
      line-height:1.7;
      max-width:38ch;
      font-size:1rem;
    }
    .status{
      margin:0 auto 18px;
      padding:13px 15px;
      border-radius:17px;
      background:rgba(92,198,255,.10);
      border:1px solid rgba(92,198,255,.18);
      color:var(--muted);
      line-height:1.55;
      font-size:.94rem;
    }
    .btn{
      width:100%;
      min-height:56px;
      border:none;
      border-radius:18px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      color:#04111f;
      font-weight:900;
      font-size:1rem;
      background:linear-gradient(135deg,var(--primary-2),var(--primary));
      box-shadow:0 14px 34px rgba(92,198,255,.24);
      transition:transform .18s ease, filter .18s ease;
    }
    .btn:hover{transform:translateY(-1px);filter:brightness(1.04)}
    .hint{
      margin-top:16px;
      color:rgba(212,222,238,.84);
      font-size:.88rem;
      line-height:1.55;
    }
    @media (max-width:480px){
      body{padding:14px}
      .card{border-radius:25px;padding:14px}
      .inner{padding:24px 18px;border-radius:21px}
    }
  </style>
</head>
<body>
  <div class="shine"></div>

  <main class="card">
    <section class="inner">
      <img class="logo" src="../../assets/fluxus-logo.png" alt="Fluxus PDV" />
      <div class="ok">✓</div>
      <h1>E-mail autenticado</h1>
      <p>Seu e-mail foi confirmado com sucesso. Volte para o aplicativo para continuar.</p>

      <div class="status" id="status">
        Toque no botão abaixo para abrir o Fluxus PDV instalado neste dispositivo.
      </div>

      <button class="btn" id="openAppBtn" type="button">
        Voltar para o app
      </button>

      <div class="hint">
        Se o app não abrir, verifique se o APK instalado foi gerado com o deep link <strong>fluxuspdv://auth/callback</strong>.
      </div>
    </section>
  </main>

  <script>
    const APP_SCHEME = "fluxuspdv";
    const APP_HOST = "auth";
    const APP_PATH = "/callback";
    const ANDROID_PACKAGE = "com.gauchin.pdvpremium";

    function buildPayload() {
      const search = window.location.search ? window.location.search.substring(1) : "";
      const hash = window.location.hash ? window.location.hash.substring(1) : "";
      const params = new URLSearchParams(search);

      if (hash) {
        const hashParams = new URLSearchParams(hash);
        hashParams.forEach((value, key) => params.set(key, value));
      }

      const query = params.toString();
      return query ? "?" + query : "";
    }

    function openFluxusApp() {
      const payload = buildPayload();
      const customDeepLink = `${APP_SCHEME}://${APP_HOST}${APP_PATH}${payload}`;

      const isAndroid = /Android/i.test(navigator.userAgent);
      const fallback = encodeURIComponent(window.location.href);

      const intentUrl =
        `intent://${APP_HOST}${APP_PATH}${payload}` +
        `#Intent;scheme=${APP_SCHEME};package=${ANDROID_PACKAGE};` +
        `S.browser_fallback_url=${fallback};end`;

      document.getElementById("status").textContent = "Abrindo o Fluxus PDV…";

      if (isAndroid) {
        window.location.href = intentUrl;
      } else {
        window.location.href = customDeepLink;
      }
    }

    document.getElementById("openAppBtn").addEventListener("click", openFluxusApp);
  </script>
</body>
</html>
