<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fluxus PDV - Autenticação</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #07111f, #0f5d86, #16a34a);
      color: #0f172a;
    }

    .card {
      width: min(92vw, 520px);
      background: rgba(255, 255, 255, .96);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .28);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    p {
      line-height: 1.55;
      color: #475569;
    }

    button,
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 16px 18px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, #0ea5e9, #16a34a);
      margin-top: 10px;
    }

    small {
      display: block;
      margin-top: 14px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Fluxus PDV</h1>
    <p>Autenticação concluída. Toque no botão abaixo para voltar ao aplicativo.</p>
    <button type="button" onclick="openFluxusApp()">Abrir Fluxus PDV</button>
    <a class="btn" href="fluxuspdv://auth?status=confirmed">Abrir pelo link direto</a>
    <small>Se não abrir, confirme se o APK está instalado neste dispositivo.</small>
  </main>

  <script>
    function openFluxusApp() {
      const params = new URLSearchParams(window.location.search || "");
      const status = params.get("status") || "confirmed";
      const customUrl = `fluxuspdv://auth?status=${encodeURIComponent(status)}`;
      const intentUrl = `intent://auth?status=${encodeURIComponent(status)}#Intent;scheme=fluxuspdv;end`;

      window.location.href = customUrl;
      setTimeout(() => {
        window.location.href = intentUrl;
      }, 700);
    }
  </script>
</body>

</html>
