<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voltar para o Fluxus PDV</title>
  <meta name="theme-color" content="#0f172a">
  <style>
    :root { color-scheme: dark; --bg:#0f172a; --card:#111827; --txt:#f8fafc; --muted:#94a3b8; --ok:#14b8a6; --a:#22d3ee; --b:#6366f1; --err:#ef4444; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background: radial-gradient(circle at top left, rgba(20,184,166,.24), transparent 34%), radial-gradient(circle at bottom right, rgba(99,102,241,.32), transparent 30%), var(--bg); color:var(--txt); padding:22px; }
    main { width:min(680px,100%); background:rgba(17,24,39,.88); border:1px solid rgba(255,255,255,.10); border-radius:28px; padding:30px; box-shadow:0 24px 80px rgba(0,0,0,.35); backdrop-filter:blur(18px); text-align:center; }
    .mark { width:76px; height:76px; display:grid; place-items:center; margin:0 auto 18px; border-radius:24px; background:linear-gradient(135deg,var(--ok),var(--b)); font-size:34px; font-weight:900; }
    h1 { margin:0 0 10px; font-size:clamp(26px,6vw,42px); line-height:1.08; }
    p { margin:0 auto 22px; color:var(--muted); font-size:17px; line-height:1.55; max-width:560px; }
    .button { width:100%; max-width:360px; display:inline-flex; align-items:center; justify-content:center; min-height:56px; padding:0 22px; border-radius:18px; background:linear-gradient(135deg,var(--ok),var(--b)); color:#fff; text-decoration:none; font-weight:900; border:0; cursor:pointer; font-size:17px; box-shadow:0 12px 30px rgba(20,184,166,.20); }
    .ghost { margin-top:12px; background:transparent; border:1px solid rgba(255,255,255,.16); box-shadow:none; }
    .status { margin-top:20px; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.07); color:#cbd5e1; font-size:14px; word-break:break-word; text-align:left; }
    .warn { color:#fecaca; }
  </style>
</head>
<body>
  <main>
    <div class="mark">✓</div>
    <h1>E-mail autenticado</h1>
    <p>Agora toque no botão abaixo para voltar ao Fluxus PDV. Se o aplicativo estiver instalado, ele será aberto automaticamente.</p>
    <a id="openApp" class="button" href="fluxuspdv://auth/callback?status=success">Voltar para o app</a>
    <a class="button ghost" href="../..">Voltar ao início</a>
    <div id="status" class="status">Preparando retorno seguro...</div>
  </main>
<script>
(function () {
  const status = document.getElementById('status');
  const openApp = document.getElementById('openApp');

  function cleanPart(part) {
    if (!part) return '';
    return part.charAt(0) === '?' || part.charAt(0) === '#' ? part.substring(1) : part;
  }

  const search = cleanPart(window.location.search);
  const hash = cleanPart(window.location.hash);
  const combined = [search, hash].filter(Boolean).join('&');
  const callback = 'fluxuspdv://auth/callback' + (combined ? '?' + combined : '?status=success');

  openApp.href = callback;
  status.textContent = 'Retorno configurado: ' + callback.replace(/(access_token=)[^&]+/g, '$1***').replace(/(refresh_token=)[^&]+/g, '$1***');

  setTimeout(function () {
    window.location.href = callback;
  }, 700);
})();
</script>
</body>
</html>
