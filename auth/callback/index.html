<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluxus PDV • E-mail autenticado</title>
  <meta name="description" content="E-mail autenticado no Fluxus PDV." />
  <style>
:root{
  --bg-a:#050b17;--bg-b:#101d33;--bg-c:#556781;
  --txt:#f8fbff;--muted:#cbd7ea;--line:rgba(255,255,255,.14);
  --card:rgba(9,16,30,.70);--cyan:#66d1ff;--cyan-2:#b9efff;
  --glow:rgba(102,209,255,.34);
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--txt);display:grid;place-items:center;padding:22px;overflow:hidden;background:radial-gradient(circle at 12% 12%,rgba(255,255,255,.18),transparent 20%),radial-gradient(circle at 85% 18%,rgba(102,209,255,.12),transparent 22%),radial-gradient(circle at 80% 84%,rgba(255,255,255,.14),transparent 18%),linear-gradient(145deg,var(--bg-a),var(--bg-b) 58%,var(--bg-c));}
body:before{content:"";position:fixed;inset:-20%;background:conic-gradient(from 180deg at 50% 50%,transparent,rgba(102,209,255,.08),transparent,rgba(255,255,255,.06),transparent);animation:spin 18s linear infinite;filter:blur(22px);opacity:.75;pointer-events:none}
body:after{content:"";position:fixed;inset:0;background-image:radial-gradient(1px 1px at 18% 22%,rgba(255,255,255,.9),transparent),radial-gradient(1px 1px at 44% 14%,rgba(255,255,255,.7),transparent),radial-gradient(1.5px 1.5px at 78% 24%,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 88% 72%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 30% 82%,rgba(255,255,255,.75),transparent);opacity:.55;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:relative;z-index:1;width:min(480px,100%);text-align:center;padding:34px 24px 26px;border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.045)),var(--card);border:1px solid var(--line);box-shadow:0 32px 90px rgba(0,0,0,.42),0 0 70px rgba(102,209,255,.10);backdrop-filter:blur(20px);overflow:hidden}
.card:before{content:"";position:absolute;inset:0;border-radius:32px;padding:1px;background:linear-gradient(135deg,rgba(185,239,255,.65),transparent 28%,rgba(255,255,255,.16) 70%,rgba(102,209,255,.42));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card:after{content:"";position:absolute;top:-90px;left:-70px;width:160px;height:320px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:rotate(24deg);animation:shine 5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{transform:translateX(-190px) rotate(24deg);opacity:0}70%{opacity:1}100%{transform:translateX(680px) rotate(24deg);opacity:0}}
.logo-wrap{width:min(240px,72vw);aspect-ratio:1.2;display:grid;place-items:center;margin:0 auto 18px;position:relative}
.logo-wrap:before{content:"";position:absolute;width:74%;height:48%;border-radius:999px;background:radial-gradient(circle,rgba(102,209,255,.28),transparent 70%);filter:blur(18px);bottom:8%;}
.logo{width:100%;height:100%;object-fit:contain;position:relative;filter:drop-shadow(0 24px 34px rgba(0,0,0,.34))}
h1{margin:0 0 8px;font-size:clamp(1.8rem,6vw,2.55rem);line-height:1.04;letter-spacing:-.045em;font-weight:900}
p{margin:0 auto 24px;max-width:32ch;color:var(--muted);font-size:1rem;line-height:1.65}.check{width:48px;height:48px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan-2),var(--cyan));color:#051120;font-weight:900;box-shadow:0 12px 30px var(--glow)}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;min-height:56px;padding:0 20px;border-radius:18px;background:linear-gradient(135deg,var(--cyan-2),var(--cyan));color:#051120;text-decoration:none;font-size:1rem;font-weight:900;letter-spacing:.01em;box-shadow:0 16px 36px rgba(102,209,255,.25);transition:transform .18s ease,box-shadow .18s ease}.btn:hover{transform:translateY(-1px);box-shadow:0 20px 42px rgba(102,209,255,.32)}
.brand{margin-top:16px;color:rgba(203,215,234,.82);font-size:.9rem}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7fe3ff;box-shadow:0 0 0 8px rgba(127,227,255,.12);margin-right:8px}
@media(max-width:520px){body{padding:16px}.card{padding:28px 18px 22px;border-radius:26px}.card:before{border-radius:26px}.logo-wrap{width:min(220px,78vw)}p{font-size:.96rem}}
</style>
</head>
<body>
  <main class="card">
    <div class="logo-wrap"><img class="logo" src="../../assets/fluxus-logo.png" alt="Fluxus PDV" /></div>
    <div class="check">✓</div>
    <h1>E-mail autenticado</h1>
    <p>Seu e-mail foi confirmado com sucesso. Volte para o aplicativo para continuar.</p>
    <a class="btn" id="openApp" href="fluxuspdv://auth/callback">Voltar para o app</a>
    <div class="brand"><span class="pulse"></span>Fluxus PDV</div>
  </main>

  <script>
    (function(){
      const params=new URLSearchParams(window.location.search);
      const hash=window.location.hash?window.location.hash.replace(/^#/,''):'';
      const q=params.toString();
      const deep='fluxuspdv://auth/callback'+(q?'?'+q:'')+(hash?(q?'&':'?')+hash:'');
      document.getElementById('openApp').href=deep;
      setTimeout(()=>{ window.location.href=deep; },900);
    })();
  </script>
</body>
</html>
