<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluxus PDV • E-mail autenticado</title>
  <meta name="description" content="Página de confirmação de e-mail do Fluxus PDV." />
  <style>
    :root{--a:#07101f;--b:#20365f;--c:#7f8dad;--text:#f8fbff;--muted:#d4deee;--p:#5cc6ff;--p2:#a7e9ff}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      color:var(--text);
      background:
        radial-gradient(circle at 16% 18%,rgba(255,255,255,.18),transparent 18%),
        radial-gradient(circle at 86% 18%,rgba(92,198,255,.15),transparent 22%),
        linear-gradient(140deg,var(--a),var(--b) 55%,var(--c));
    }
    .card{
      width:min(500px,100%);
      border-radius:30px;
      padding:22px;
      background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.045));
      border:1px solid rgba(255,255,255,.16);
      box-shadow:0 28px 70px rgba(0,0,0,.38);
      backdrop-filter:blur(18px);
      text-align:center;
    }
    .inner{
      background:rgba(10,18,35,.70);
      border:1px solid rgba(255,255,255,.12);
      border-radius:24px;
      padding:28px 24px;
    }
    img{width:min(230px,78%);filter:drop-shadow(0 22px 32px rgba(0,0,0,.32));margin-bottom:12px}
    .ok{
      width:54px;height:54px;border-radius:18px;margin:0 auto 18px;
      display:grid;place-items:center;color:#04111f;font-weight:900;
      background:linear-gradient(135deg,var(--p2),var(--p));
    }
    h1{margin:0 0 10px;font-size:clamp(1.8rem,5vw,2.4rem);letter-spacing:-.04em}
    p{margin:0 auto 22px;color:var(--muted);line-height:1.7;max-width:36ch}
    a{
      width:100%;min-height:56px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;
      text-decoration:none;color:#04111f;font-weight:900;background:linear-gradient(135deg,var(--p2),var(--p));
      box-shadow:0 14px 34px rgba(92,198,255,.24);
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="inner">
      <img src="./assets/fluxus-logo.png" alt="Fluxus PDV" />
      <div class="ok">✓</div>
      <h1>E-mail autenticado</h1>
      <p>Seu e-mail foi confirmado com sucesso. Volte para o aplicativo para continuar.</p>
      <a href="./auth/callback/">Voltar para o app</a>
    </section>
  </main>
</body>
</html>
